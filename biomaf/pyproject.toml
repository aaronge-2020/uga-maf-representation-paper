[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biomaf"
version = "1.0.0"
description = "Bio MAF: fixed, interpretable per-tumor summaries of somatic mutations (948 features from an annotated MAF)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]
license = { text = "CC-BY-4.0, see parent repository LICENSE" }

[project.scripts]
biomaf = "biomaf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["biomaf*"]

[tool.setuptools.package-data]
biomaf = ["resources/*"]
