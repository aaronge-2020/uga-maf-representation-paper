# A/B/C ablation, arm B — EPOCH FIX ONLY.
#
# Identical to arm A except final_epoch_selection is on: the architecture is still ranked over
# 3 epochs, but the winner is retrained at full length (150 epochs) on the inner split to choose
# its stopping epoch before the outer refit.
#
# Dictionaries are still hashed, exactly as in arm A. The A -> B delta is therefore attributable
# to the training-budget bug alone.

runtime_profile: muat-ab-b-epochfix
tree_method: hist
cv_folds: 5
endpoint_registry: config/endpoint_registry.yaml

feature_cache:
  enabled: true
  dir: results/cache/features
  validate_fasta: false

experiments:
  main_manuscript_complete_panel:
    enabled: false
  muat_style_tcga_comparator:
    enabled: true
    output_tag: ab_b_epochfix
    endpoints:
      - HRD_Score
      - hrd_binary_33
    primary_endpoint: HRD_Score
    primary_task: HRD_Score
    primary_metric: spearman
    primary_metric_by_endpoint:
      HRD_Score: spearman
      hrd_binary_33: auroc
    nested_validation: true
    selection_metric: spearman
    selection_metric_by_endpoint:
      HRD_Score: spearman
      hrd_binary_33: auroc
    split_manifest_by_endpoint:
      HRD_Score:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: HRD_Score
        representation: signatures_plus_MAF_stack
        learner: xgboost
      hrd_binary_33:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: hrd_binary_33
        representation: signatures_plus_MAF_stack
        learner: xgboost
    require_canonical_split: true
    run_manuscript_endpoints: false
    secondary_endpoints:
      - hrd_binary_33
    smoke_run: false
    folds: 5
    epochs: 150
    batch_size: 1
    regression_batch_size: 1
    eval_batch_size: 1
    embed_dim: 128
    attention_heads: 1
    num_layers: 1
    pooling_mode: attention_weighted
    architecture_search_enabled: true
    architecture_search_embed_dims: [128, 256, 512]
    architecture_search_num_layers: [1, 2, 4]
    architecture_search_attention_heads: [1, 2]
    architecture_search_epochs: 3
    # Inner-validation early stopping on the full-length epoch-selection pass. Same value in all
    # three arms. Cannot change the selected epoch unless validation improves again after 25
    # consecutive epochs of no improvement.
    early_stopping_patience: 25

    # ---- ARM B: epoch bug fixed, dictionaries still hashed ----
    final_epoch_selection: true
    dictionary_mode: fixed_hash
    motif_hash_buckets: 1024
    position_hash_buckets: 2048
    annotation_hash_buckets: 256
    # -----------------------------------------------------------

    feature_dim: 24
    dropout: 0.1
    count_feature_mode: log_count
    scheduler: cosine
    lr: 0.0006
    momentum: 0.9
    weight_decay: 0.0
    max_events_per_sample: 5000
    maf_chunksize: 500000
    device: auto
    amp: true
    torch_num_threads: 8
    dataloader_workers: 0
    preload_tensors_to_device: true
    trim_to_observed_events: true
    resume_checkpoints: false
    epoch_checkpoints: false
    progress_interval_epochs: 25
    official_mutation_type: snv+mnv+indel

outputs:
  make_figures_after_run: false
  cleanup_work_dir_after_run: false
  strict_manuscript: false
  strict_no_leakage: true
