# A/B/C/D ablation, arm D — MuAt-FAITHFUL INPUT REPRESENTATION.
#
# Arm C plus the two deviations that change what the model actually sees:
#
#   motif_grammar: muat_symbolic
#       Bounded three-symbol mutation windows, as in MuAt's Sigma^3 encoding (ApCpG>ApTpG is
#       A[C>T]G; a diadenine deletion preceded by a cytosine is C[delA][delA]). The legacy grammar
#       emitted one token per distinct allele string of up to 12 characters, giving an unbounded,
#       data-dependent vocabulary (1,464 motifs on 772 HRD samples) in which a 12-base
#       substitution is a single token.
#
#   annotation_strand: transcriptional
#       MuAt's four-class strand attribute: the mutation's pyrimidine reference base is on the
#       same strand as a gene, the opposite strand, the mutation overlaps two genes, or it is
#       intergenic. The legacy code passed the MAF STRAND field through as +/-/0/na, which records
#       the gene's orientation rather than the pyrimidine's orientation relative to it, and so
#       carries none of the transcriptional strand asymmetry the attribute exists to capture.
#       (MC3 gives one row per variant, so the two-gene class is not recoverable and is emitted as
#       `unknown`; the cardinality stays at four, hence 2 x 2 x 4 = 16 as in the paper.)
#
# C -> D therefore measures how much the event tokenisation is worth, holding the architecture,
# the folds, the seed and the training protocol fixed. That is a representation ablation inside
# the neural arm, which is exactly the question the manuscript is about.

runtime_profile: muat-ab-d-faithful
tree_method: hist
cv_folds: 5
endpoint_registry: config/endpoint_registry.yaml

feature_cache:
  enabled: true
  dir: results/cache/features
  validate_fasta: false

experiments:
  main_manuscript_complete_panel:
    enabled: false
  muat_style_tcga_comparator:
    enabled: true
    output_tag: ab_d_faithful
    endpoints:
      - HRD_Score
      - hrd_binary_33
    primary_endpoint: HRD_Score
    primary_task: HRD_Score
    primary_metric: spearman
    primary_metric_by_endpoint:
      HRD_Score: spearman
      hrd_binary_33: auroc
    nested_validation: true
    selection_metric: spearman
    selection_metric_by_endpoint:
      HRD_Score: spearman
      hrd_binary_33: auroc
    split_manifest_by_endpoint:
      HRD_Score:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: HRD_Score
        representation: signatures_plus_MAF_stack
        learner: xgboost
      hrd_binary_33:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: hrd_binary_33
        representation: signatures_plus_MAF_stack
        learner: xgboost
    require_canonical_split: true
    run_manuscript_endpoints: false
    secondary_endpoints:
      - hrd_binary_33
    smoke_run: false
    folds: 5
    epochs: 150
    batch_size: 1
    regression_batch_size: 1
    eval_batch_size: 1
    embed_dim: 128
    attention_heads: 1
    num_layers: 1
    pooling_mode: attention_weighted
    architecture_search_enabled: true
    architecture_search_embed_dims: [128, 256, 512]
    architecture_search_num_layers: [1, 2, 4]
    architecture_search_attention_heads: [1, 2]
    architecture_search_epochs: 3
    early_stopping_patience: 25
    final_epoch_selection: true
    dictionary_mode: exact

    # ---- ARM D: MuAt-faithful input representation ----
    motif_grammar: muat_symbolic
    annotation_strand: transcriptional
    # ---------------------------------------------------

    motif_hash_buckets: 1024
    position_hash_buckets: 2048
    annotation_hash_buckets: 256
    feature_dim: 24
    dropout: 0.1
    count_feature_mode: log_count
    scheduler: cosine
    lr: 0.0006
    momentum: 0.9
    weight_decay: 0.0
    max_events_per_sample: 5000
    maf_chunksize: 500000
    device: auto
    amp: true
    torch_num_threads: 8
    dataloader_workers: 0
    preload_tensors_to_device: true
    trim_to_observed_events: true
    resume_checkpoints: false
    epoch_checkpoints: false
    progress_interval_epochs: 25
    official_mutation_type: snv+mnv+indel

outputs:
  make_figures_after_run: false
  cleanup_work_dir_after_run: false
  strict_manuscript: false
  strict_no_leakage: true
