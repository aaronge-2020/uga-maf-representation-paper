runtime_profile: muat-compatible-main-endpoints-comparable
tree_method: hist
cv_folds: 5
endpoint_registry: config/endpoint_registry.yaml

feature_cache:
  enabled: true
  dir: results/cache/features
  validate_fasta: true

experiments:
  main_manuscript_complete_panel:
    enabled: false
  muat_style_tcga_comparator:
    enabled: true
    output_tag: main_endpoints_comparable
    primary_task: cancer_type_top20
    secondary_endpoints:
      - damage_class
      - HRD_Score
      - hrd_binary_33
    primary_metric_by_endpoint:
      HRD_Score: spearman
      hrd_binary_33: auroc
      damage_class: balanced_accuracy
      cancer_type_top20: balanced_accuracy
    selection_metric_by_endpoint:
      HRD_Score: spearman
      hrd_binary_33: auroc
      damage_class: balanced_accuracy
      cancer_type_top20: balanced_accuracy
    nested_validation: true
    split_manifest_by_endpoint:
      HRD_Score:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: HRD_Score
        representation: signatures_plus_MAF_stack
        learner: xgboost
      hrd_binary_33:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: hrd_binary_33
        representation: signatures_plus_MAF_stack
        learner: xgboost
      cancer_type_top20:
        source: results/tables/main_manuscript_complete_panel_oof_predictions.csv
        endpoint: cancer_type_top20
        representation: signatures_plus_MAF_stack
        learner: xgboost
    run_manuscript_endpoints: false
    require_canonical_split: true
    paper_reference_accuracy: 0.641
    paper_reference_top5_accuracy: 0.906
    smoke_run: false
    folds: 5
    epochs: 150
    batch_size: 1
    regression_batch_size: 1
    eval_batch_size: 1
    embed_dim: 128
    attention_heads: 1
    num_layers: 1
    pooling_mode: attention_weighted
    architecture_search_enabled: true
    architecture_search_embed_dims: [128, 256, 512]
    architecture_search_num_layers: [1, 2, 4]
    architecture_search_attention_heads: [1, 2]
    architecture_search_epochs: 3
    feature_dim: 24
    dropout: 0.1
    count_feature_mode: log_count
    scheduler: cosine
    lr: 0.0006
    momentum: 0.9
    weight_decay: 0.0
    max_events_per_sample: 5000
    kucab_max_events_per_sample: 512
    maf_chunksize: 500000
    dictionary_mode: fixed_hash
    motif_hash_buckets: 1024
    position_hash_buckets: 2048
    annotation_hash_buckets: 256
    device: auto
    amp: true
    torch_num_threads: 8
    dataloader_workers: 0
    preload_tensors_to_device: true
    trim_to_observed_events: true
    resume_checkpoints: true
    epoch_checkpoints: true
    progress_interval_epochs: 10
    official_mutation_type: snv+mnv+indel

outputs:
  make_figures_after_run: false
  cleanup_work_dir_after_run: false
  strict_manuscript: true
  strict_no_leakage: true
