<text x="44" y="54" class="title">Supplementary Figure S1. Representation construction</text>
<text x="44" y="84" class="subtitle">Each feature block is cached with input fingerprints, split provenance, FASTA provenance, parameters and sample manifests.</text>
<text x="44" y="112" class="tiny">Cards show the reproducible construction path used for strict no-leakage manuscript outputs.</text>
<rect x="70" y="150" width="410" height="276" rx="8" fill="#FFFFFF" stroke="#2F6FDB" stroke-width="2" class="shadow"/>
<circle cx="112" cy="192" r="22" fill="#2F6FDB"/><text x="112" y="199" text-anchor="middle" fill="#FFFFFF" font-weight="800">1</text>
<text x="148" y="190" class="panel-title">Spectra</text>
<text x="148" y="218" class="small">Count SBS/DBS/ID channels and burden;</text>
<text x="148" y="235" class="small">normalize within each sample.</text>
<rect x="595" y="150" width="410" height="276" rx="8" fill="#FFFFFF" stroke="#A855C7" stroke-width="2" class="shadow"/>
<circle cx="637" cy="192" r="22" fill="#A855C7"/><text x="637" y="199" text-anchor="middle" fill="#FFFFFF" font-weight="800">2</text>
<text x="673" y="190" class="panel-title">FASTA windows</text>
<text x="673" y="218" class="small">Fetch GRCh37 sequence context and</text>
<text x="673" y="235" class="small">validate REF allele before encoding.</text>
<rect x="1120" y="150" width="410" height="276" rx="8" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="2" class="shadow"/>
<circle cx="1162" cy="192" r="22" fill="#0F8B8D"/><text x="1162" y="199" text-anchor="middle" fill="#FFFFFF" font-weight="800">3</text>
<text x="1198" y="190" class="panel-title">Channel KME</text>
<text x="1198" y="218" class="small">Use locked channel geometry and average</text>
<text x="1198" y="235" class="small">event-level kernels.</text>
<rect x="70" y="560" width="410" height="276" rx="8" fill="#FFFFFF" stroke="#159A74" stroke-width="2" class="shadow"/>
<circle cx="112" cy="602" r="22" fill="#159A74"/><text x="112" y="609" text-anchor="middle" fill="#FFFFFF" font-weight="800">4</text>
<text x="148" y="600" class="panel-title">Bio MAF v4</text>
<text x="148" y="628" class="small">Select among predeclared gene, driver,</text>
<text x="148" y="645" class="small">hotspot, consequence, VAF and burden</text>
<text x="148" y="662" class="small">blocks inside nested CV.</text>
<rect x="595" y="560" width="410" height="276" rx="8" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="2" class="shadow"/>
<circle cx="637" cy="602" r="22" fill="#6D5BD0"/><text x="637" y="609" text-anchor="middle" fill="#FFFFFF" font-weight="800">5</text>
<text x="673" y="600" class="panel-title">UGA variants</text>
<text x="673" y="628" class="small">Supplementary atlas and channel geometry</text>
<text x="673" y="645" class="small">checks are generated from locked inputs.</text>
<rect x="1120" y="560" width="410" height="276" rx="8" fill="#FFFFFF" stroke="#D9822B" stroke-width="2" class="shadow"/>
<circle cx="1162" cy="602" r="22" fill="#D9822B"/><text x="1162" y="609" text-anchor="middle" fill="#FFFFFF" font-weight="800">6</text>
<text x="1198" y="600" class="panel-title">Checkpointed outputs</text>
<text x="1198" y="628" class="small">Every public table and figure traces</text>
<text x="1198" y="645" class="small">back to explicit cached artifacts.</text>
