<text x="96" y="910" class="small">Strict reruns invalidate only stale feature caches; checkpointed OOF predictions and tests preserve reproducibility without rerunning unaffected slots.</text>
<text x="96" y="930" class="tiny">All artifact names are drawn inside the card bounds to mirror the HTML and Word export layout.</text></svg>